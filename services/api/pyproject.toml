[project]
name = "biletflow-api"
version = "0.1.0"
description = "BiletFlow FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "boto3>=1.35",
  "celery[redis]>=5.4",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "icalendar>=6.1",
  "orjson>=3.10",
  "pillow>=11.0",
  "pydantic-settings>=2.7",
  "pyjwt[crypto]>=2.10",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.20",
  "qrcode>=8.0",
  "redis>=5.2",
  "reportlab>=4.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34"
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "mypy>=1.14",
  "pypdf>=6.18.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
