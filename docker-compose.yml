name: biletflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: biletflow
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow -d biletflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: biletflow
      MINIO_ROOT_PASSWORD: change-me-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./services/api
    env_file: ${BILETFLOW_ENV_FILE:-.env.example}
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8010:8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./services/api
    env_file: ${BILETFLOW_ENV_FILE:-.env.example}
    command: uv run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./services/api
    env_file: ${BILETFLOW_ENV_FILE:-.env.example}
    command: uv run celery -A app.worker.celery_app worker --beat --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8010/api/v1
      EXPO_PUBLIC_WS_URL: ws://localhost:8010/api/v1
    command: npm --workspace @biletflow/client run web -- --port 8081 --host lan
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
